[platformio]
default_envs = freenove_esp32_s3_n16r8

[env]
platform = espressif32 @ ^6.7.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ~8.3.11
    mathieucarbou/ESPAsyncWebServer @ ^3.1.1
    mathieucarbou/AsyncTCP @ ^3.2.4

; ============================================================================
; 1. SCHEDA PRINCIPALE: Freenove FNK0104B ESP32-S3 (16MB Flash + 8MB PSRAM OPI)
;    Funziona sia con Display Touch collegato sia in modalità Headless (Auto-Probe I2C)
; ============================================================================
[env:freenove_esp32_s3_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================================
; 2. ESP32 CLASSICO (WROOM-32 / DevKit V1 4MB Flash - Modalità Headless / Universale)
; ============================================================================
[env:esp32_classic]
board = esp32dev
board_build.partitions = min_spiffs.csv

; ============================================================================
; 3. ESP32-C3 (SuperMini / DevKitM-1 RISC-V Single-Core 4MB Flash)
; ============================================================================
[env:esp32_c3]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
